name: Nightly CFO tracker
on:
  schedule:
    - cron: '41 3 * * 2-6'   # 03:41 UTC Tue-Sat = Mon-Fri evening in New York, after the SEC 10pm filing cutoff
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: tracker
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy lxml yfinance
      - name: Run tracker
        run: |
          cp data.json data_before.json
          python tracker.py data.json config.json | tee run.log
      - name: Sanity check
        run: |
          python - <<'PY'
          import json
          a=json.load(open('data_before.json')); b=json.load(open('data.json'))
          assert len(b['signals'])>=len(a['signals']), 'signals shrank'
          assert b.get('updated'), 'no timestamp'
          errs=b['runs'][-1].get('errors',[])
          print('errors this run:',errs)
          PY
      - name: Save
        run: |
          rm -f data_before.json run.log
          git config user.name "cfo-tracker"
          git config user.email "cfo-tracker@users.noreply.github.com"
          git add data.json
          git commit -m "Nightly update $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
